<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanji decks</title><style>
:root { --bg:#eae6f7; --card:#fff; --ink:#1d1b18; --muted:#6b665e; --line:#eae6f7;
        --brand:#261c76; --brand-soft:#eae6f7; --tag:#e5e5e5; --tag-ink:#6b665e; --unrated:#9a948a;
        --pick:#261c76; --pick-ink:#fff; --shadow:0 4px 24px rgba(26,20,77,.12);
        --learn-off:#e5e5e5; --learn-off-hover:#d6d6d6; --learn-on:#9bd8a8; --learn-ink:#1d5631; --read-tint:#f5f3fc; --hover-line:#bba6ee; --particle:#e58900; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#14122a; --card:#1e1b33; --ink:#ece8f5; --muted:#a8a3b8; --line:#2f2a4d;
          --brand:#c9c0ff; --brand-soft:#2f2a4d; --tag:#2c2a3a; --tag-ink:#c4bfd0; --unrated:#8a8698;
          --pick:#c9c0ff; --pick-ink:#1a1640; --shadow:0 4px 24px rgba(0,0,0,.4);
          --learn-off:#2c2a3a; --learn-off-hover:#3a3750; --learn-on:#3f8a57; --learn-ink:#eaf7ee; --read-tint:#25213f; --hover-line:#6f5fa8; --particle:#e58900; } }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); line-height:1.5;
       font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif; }
main { max-width:592px; height:100%; margin:0 auto; padding:0 16px;
       display:flex; flex-direction:column; justify-content:center; }
.card { background:var(--card); border-radius:20px; box-shadow:var(--shadow); padding:24px 20px;
        height:min(90%, calc(100% - 144px)); overflow-y:auto; overscroll-behavior:contain;
        display:flex; flex-direction:column; gap:24px; }
.card > * { flex:none; }
.icon { display:inline-flex; flex:none; }
.icon path[stroke] { stroke:var(--brand); }
.icon path[fill]:not([fill="none"]) { fill:var(--brand); }

.card > header { position:relative; display:flex; align-items:flex-start; gap:16px; padding-bottom:20px; }
/* "Learned" toggle: top-right corner, centred on the level badge's row */
.learn { position:absolute; top:2px; right:0; width:24px; height:24px; padding:0; border:0; background:none;
         border-radius:50%; cursor:pointer; line-height:0; }
.learn .learn-bg { fill:var(--learn-off); transition:fill .15s; }
.learn:hover .learn-bg { fill:var(--learn-off-hover); }
.learn[aria-pressed="true"] .learn-bg { fill:var(--learn-on); }
.learn:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.learn::after { content:attr(data-tip); position:absolute; top:calc(100% + 8px); right:0; white-space:nowrap;
                background:var(--brand); color:#fff; font-size:12px; font-weight:700; line-height:1.4;
                padding:5px 9px; border-radius:6px; opacity:0; pointer-events:none; transition:opacity .12s; }
.learn:hover::after, .learn:focus-visible::after { opacity:1; }
.kanji { font-size:96px; line-height:1; font-weight:500; }
.info { flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:6px; padding-top:4px; }
.meaning { font-size:18px; line-height:1.4; font-weight:700; }
.readings { align-self:stretch; display:flex; flex-direction:column; gap:2px; padding-top:4px; }
.rrow { display:flex; align-items:baseline; gap:8px; }
.rl { width:28px; flex:none; font-size:12px; color:var(--brand); }
.rv { flex:1; display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:14px; }
.rv .ro { font-size:12px; }
.ro { color:var(--muted); }

.lv { display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.02em; line-height:1.5;
      padding:1px 7px; border-radius:999px; background:var(--tag); color:var(--tag-ink); white-space:nowrap; }
.lv.unrated { color:var(--unrated); font-weight:500; }

.sections { display:flex; flex-direction:column; gap:16px; }
details.sec { border:1px solid var(--line); border-radius:12px; overflow:hidden; }
summary { cursor:pointer; list-style:none; }
summary::-webkit-details-marker { display:none; }
details.sec > summary { background:var(--brand-soft); padding:10px 14px;
                        display:flex; align-items:center; justify-content:space-between; gap:8px; }
.sl { display:flex; align-items:center; gap:8px; }
.sec-chev { transform:rotate(-90deg); transition:transform .15s; }
details.sec[open] > summary .sec-chev { transform:none; }
h2 { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--brand); margin:0; }
.count { font-size:12px; color:var(--brand); }

.radicals { padding:16px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
.radical { display:flex; align-items:center; gap:16px; padding:8px 16px; border:1px solid var(--line);
           border-radius:10px; line-height:1.3; }
.radical .rg { font-size:24px; }
.radical .rm { font-size:12px; color:var(--muted); }

.vocab { padding:8px 14px; }
.picker { display:flex; flex-wrap:wrap; gap:6px 4px; padding-bottom:12px; }
.picker input { position:absolute; opacity:0; pointer-events:none; }
.picker label { font-size:12.8px; font-weight:700; padding:4px 12px; border-radius:999px; cursor:pointer;
                border:1px solid var(--line); color:var(--brand); }
.picker input:checked + label { background:var(--pick); color:var(--pick-ink); border-color:var(--pick); }
.picker input:focus-visible + label { outline:2px solid var(--brand); outline-offset:2px; }

.word { display:flex; flex-direction:column; align-items:flex-start; gap:4px; padding:12px 0;
        border-bottom:1px solid var(--line); }
.word:last-of-type { border-bottom:0; }
.word-head { align-self:stretch; display:flex; justify-content:space-between; align-items:flex-end; gap:8px; }
.wl { display:flex; flex-wrap:wrap; align-items:flex-end; gap:4px 10px; min-width:0; }
.lv-wrap { padding-bottom:6px; flex:none; }
.word-ja { font-size:22.4px; font-weight:700; line-height:1.3; }
.wr { display:flex; align-items:center; gap:8px; padding-bottom:3px; font-size:16px; }
.word-en { font-size:16px; color:var(--muted); }

details.ph { align-self:stretch; }
details.ph > summary { display:flex; align-items:center; gap:8px; padding:2px 0; font-size:13.6px; color:var(--muted); }
details.ph .chev-open { display:none; }
details.ph[open] .chev-open { display:inline-flex; }
details.ph[open] .chev-closed { display:none; }
ul.phrases { list-style:none; margin:4px 0 0; padding:8px 0 8px 12px; border-left:3px solid var(--line);
             display:flex; flex-direction:column; gap:10px; }
ul.phrases li { display:flex; flex-direction:column; gap:2px; }
.ph-row { display:flex; justify-content:space-between; align-items:flex-end; gap:8px; }
.ph-ja { font-size:16.8px; }
.ph-en { font-size:14.4px; color:var(--muted); }

/* Tappable words: light accent highlight on hover, details in the bottom sheet */
.w { font:inherit; color:inherit; background:none; border:0; padding:0 2px; margin:0 -2px; border-radius:4px;
     cursor:pointer; transition:background .12s; }
.w:hover { background:var(--brand-soft); }
.w:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
.pt { color:var(--particle); } /* particles in phrases: は, が, を, に… */
.w.word-ja { font-size:22.4px; font-weight:700; line-height:1.3; } /* headwords keep their size as buttons */
/* Bottom sheet: slides up from the bottom; closes with ×, Esc or a tap outside */
dialog.sheet { position:fixed; inset:auto 0 0 0; margin:0 auto; padding:0; width:100%; max-width:592px; max-height:85vh;
               border:0; border-radius:20px 20px 0 0; background:var(--card); color:var(--ink);
               box-shadow:0 -4px 24px rgba(26,20,77,.12); }
dialog.sheet[open] { animation:sheet-up .22s ease-out; }
@keyframes sheet-up { from { transform:translateY(100%); } to { transform:none; } }
dialog.sheet::backdrop { background:rgba(26,20,77,.35); }
.sheet-body { position:relative; padding:12px 24px 32px; text-align:center; outline:none; }
.sheet-handle { display:block; width:40px; height:4px; margin:0 auto; border-radius:2px; background:var(--brand-soft); }
.sheet-close { position:absolute; top:12px; right:12px; border:0; box-shadow:none; background:var(--brand-soft); cursor:pointer; }
.sheet-word { margin:24px 0 4px; font-size:44px; font-weight:700; line-height:1.5; }
.sheet-word rt { font-size:16px; font-weight:500; color:var(--muted); }
.sheet-meaning { margin:0 0 20px; font-size:16px; color:var(--muted); }
.sheet .play { width:44px; height:44px; align-items:center; justify-content:center; background:var(--brand-soft); }
.sheet .play svg { width:20px; height:20px; }
.play { display:none; padding:0; margin:0; border:0; background:none; cursor:pointer; line-height:0; border-radius:50%; }
.tts .play { display:inline-flex; }
.play:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.none { color:var(--muted); font-size:14.4px; font-style:italic; margin:6px 0 0; }

.top-row { flex:none; display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.progress { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
.progress-legend { display:flex; justify-content:space-between; font-size:12px; font-weight:700;
                   letter-spacing:.02em; color:var(--brand); }
.progress-track { height:6px; border-radius:999px; background:var(--card); overflow:hidden; }
.progress-fill { height:100%; border-radius:999px; background:var(--brand); }
.deck-nav { flex:none; display:flex; justify-content:center; gap:24px; margin-top:16px; }
.nav-btn { display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 20px; border-radius:999px;
           background:var(--card); color:var(--brand); box-shadow:var(--shadow);
           font-size:14px; font-weight:700; text-decoration:none; transition:background .12s; }
.nav-btn:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.nav-btn[aria-disabled="true"] { opacity:.4; box-shadow:none; pointer-events:none; }
.nav-back .icon { transform:scaleX(-1); }
/* Back / Next: round, icon only; 44px keeps them an easy touch target on phones */
.nav-back, .nav-next { width:44px; padding:0; justify-content:center; }
.nav-back svg, .nav-next svg { width:14px; height:14px; }
.close-btn, .back-btn, .continue-btn, .quiz-btn { flex:none; width:36px; height:36px; padding:0; justify-content:center; }
/* Continue: beside the deck's progress bar; tooltip like "Mark as learned" */
.bar-row { display:flex; align-items:center; gap:12px; }
.bar-row .progress { flex:1; }
.continue-btn, .quiz-btn { position:relative; border:0; cursor:pointer; font:inherit; }
.continue-btn::after, .quiz-btn::after { content:attr(data-tip); position:absolute; top:calc(100% + 8px); right:0; white-space:nowrap;
                       background:var(--brand); color:#fff; font-size:12px; font-weight:700; line-height:1.4;
                       padding:5px 9px; border-radius:6px; opacity:0; pointer-events:none; transition:opacity .12s; z-index:1; }
.continue-btn:hover::after, .continue-btn:focus-visible::after,
.quiz-btn:hover::after, .quiz-btn:focus-visible::after { opacity:1; }
/* "Coming soon" dialog */
.soon-dialog { width:calc(100% - 32px); max-width:320px; padding:28px 24px 24px; border:0; border-radius:20px;
               background:var(--card); color:var(--ink); box-shadow:var(--shadow); text-align:center; }
.soon-dialog::backdrop { background:rgba(26,20,77,.35); }
.sd-icon { display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px;
           border-radius:999px; background:var(--brand-soft); }
.sd-title { margin:12px 0 4px; font-size:18px; font-weight:700; color:var(--ink); }
.sd-text { margin:0; font-size:14px; color:var(--muted); }
.sd-btn { margin-top:20px; height:40px; padding:0 24px; border:0; border-radius:999px; background:var(--pick);
          color:var(--pick-ink); font:inherit; font-size:14px; font-weight:700; cursor:pointer; }
.sd-btn:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.deck-title { display:flex; align-items:center; gap:12px; min-width:0; }

/* Main page: one card per JLPT level */
.decks { display:flex; flex-direction:column; gap:12px; }
.deck-card { display:flex; align-items:center; gap:16px; padding:16px; background:var(--card); border-radius:16px;
             border:2px solid transparent;
             text-decoration:none; color:var(--ink); box-shadow:0 2px 8px rgba(26,20,77,.06); transition:background .12s; }
a.deck-card:hover { border-color:var(--hover-line); } /* same as kanji rows and tiles */
a.deck-card:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.dc-level { flex:none; display:flex; align-items:center; justify-content:center; width:48px; height:48px;
            border-radius:12px; background:var(--brand-soft); color:var(--brand); font-size:18px; font-weight:700; }
.dc-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.dc-title { font-size:17px; font-weight:700; }
.dc-meta { font-size:13px; color:var(--muted); }
.dc-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.dc-tags { flex:none; display:flex; gap:6px; }
.tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11.5px; font-weight:700;
       line-height:1.5; letter-spacing:.02em; white-space:nowrap; }
.tag-progress { background:var(--pick); color:var(--pick-ink); }
.tag-learned { background:var(--learn-on); color:var(--learn-ink); }
.tag-soon { background:var(--tag); color:var(--tag-ink); }
/* keeps "Coming soon" tags in line with the tags of decks that have a chevron */
.dc-chev-space { flex:none; width:10px; }
.deck-card.soon { opacity:.5; box-shadow:none; }

/* Deck page */
body.deck-page main { height:auto; display:block; padding:16px; }
.deck-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; }
.deck-head h1 { font-size:24px; line-height:1.3; margin:0; color:var(--ink); }
.deck-bars { display:flex; flex-direction:column; gap:14px; padding-top:8px; margin-bottom:24px; }
.progress-fill.learned-fill { background:var(--learn-on); }
.deck-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
@media (min-width:520px) { .deck-grid { grid-template-columns:repeat(6, 1fr); } }
.tile { position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:12px 4px 10px;
        background:var(--card); border:2px solid transparent; border-radius:14px; text-decoration:none; color:var(--ink);
        box-shadow:0 2px 8px rgba(26,20,77,.06); transition:background .12s; }
.tile:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.tile.current { border-color:var(--brand); }
.tk { font-size:32px; line-height:1.2; font-weight:500; }
.tm { max-width:100%; padding:0 4px; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile-check { position:absolute; top:6px; right:6px; display:none; line-height:0; }
.tile-check .learn-bg { fill:var(--learn-on); }
.tile.learned .tile-check { display:block; }

/* Deck page, list view: one elongated card per kanji */
.deck-list { display:flex; flex-direction:column; gap:8px; }
.row { display:flex; align-items:center; gap:14px; padding:10px 16px; background:var(--card);
       border:2px solid transparent; border-radius:14px; text-decoration:none; color:var(--ink);
       box-shadow:0 2px 8px rgba(26,20,77,.06); transition:background .12s; }
.row:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.row.current { border-color:var(--brand); }
.rk { flex:none; width:40px; text-align:center; font-size:30px; line-height:1.2; font-weight:500; }
.rmn { flex:1; min-width:0; font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row-check { flex:none; line-height:0; }
.row-check .learn-bg { fill:var(--learn-off); }
.row.learned .row-check .learn-bg { fill:var(--learn-on); }
/* Read = opened at least once: a faint lavender tint, in both views */
.row.read, .tile.read { background:var(--read-tint); }
/* Hover: mid-lavender border, between light accent and the Dark accent "last opened" outline */
.row:not(.current):hover, .tile:not(.current):hover { border-color:var(--hover-line); }
.deck-list[hidden], .deck-grid[hidden] { display:none; }
/* List / Grid switch */
.view-tabs { flex:none; display:inline-flex; gap:2px; padding:3px; background:var(--card); border-radius:999px;
             box-shadow:0 2px 8px rgba(26,20,77,.06); }
.view-tabs button { display:inline-flex; align-items:center; justify-content:center; width:34px; height:30px; padding:0; border:0;
                    border-radius:999px; background:none; color:var(--brand); font:inherit; font-size:12.8px;
                    font-weight:700; cursor:pointer; transition:background .12s, color .12s; }
.view-tabs button:hover { background:var(--brand-soft); }
.view-tabs button[aria-selected="true"] { background:var(--pick); color:var(--pick-ink); }
.view-tabs button:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.view-tabs svg { display:block; }
</style></head>
<body class="deck-page"><main>
<header class="deck-head"><h1>Kanji decks</h1></header>
<nav class="decks" aria-label="JLPT levels"><a class="deck-card" href="N5/index.html" data-level="N5"><span class="dc-level">N5</span><span class="dc-body"><span class="dc-head"><span class="dc-title">N5 kanji</span><span class="dc-tags"><span class="tag tag-progress" title="Progress">0%</span><span class="tag tag-learned">0% learned</span></span></span><span class="dc-meta">79 kanji</span></span><span class="icon " aria-hidden="true"><svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="icon/chevron-right">
<path id="Vector" d="M3.5 1.5L7 5L3.5 8.5" stroke-width="2" stroke-linecap="square" stroke="#261C76"/>
</g>
</svg></span></a><div class="deck-card soon" aria-disabled="true"><span class="dc-level">N4</span><span class="dc-body"><span class="dc-head"><span class="dc-title">N4 kanji</span><span class="dc-tags"><span class="tag tag-soon">Coming soon</span></span></span><span class="dc-meta">166 kanji</span></span><span class="dc-chev-space"></span></div><div class="deck-card soon" aria-disabled="true"><span class="dc-level">N3</span><span class="dc-body"><span class="dc-head"><span class="dc-title">N3 kanji</span><span class="dc-tags"><span class="tag tag-soon">Coming soon</span></span></span><span class="dc-meta">367 kanji</span></span><span class="dc-chev-space"></span></div><div class="deck-card soon" aria-disabled="true"><span class="dc-level">N2</span><span class="dc-body"><span class="dc-head"><span class="dc-title">N2 kanji</span><span class="dc-tags"><span class="tag tag-soon">Coming soon</span></span></span><span class="dc-meta">367 kanji</span></span><span class="dc-chev-space"></span></div><div class="deck-card soon" aria-disabled="true"><span class="dc-level">N1</span><span class="dc-body"><span class="dc-head"><span class="dc-title">N1 kanji</span><span class="dc-tags"><span class="tag tag-soon">Coming soon</span></span></span><span class="dc-meta">1,232 kanji</span></span><span class="dc-chev-space"></span></div></nav>
</main><script type="application/json" id="decks-data">{"N5": ["日", "一", "国", "人", "年", "大", "十", "二", "本", "中", "長", "出", "三", "時", "行", "見", "月", "後", "前", "生", "五", "間", "上", "東", "四", "今", "金", "九", "入", "学", "高", "円", "子", "外", "八", "六", "下", "来", "気", "小", "七", "山", "話", "女", "北", "午", "百", "書", "先", "名", "川", "千", "水", "半", "男", "西", "電", "校", "語", "土", "木", "聞", "食", "車", "何", "南", "万", "毎", "白", "天", "母", "火", "右", "読", "友", "左", "休", "父", "雨"]}</script><script>
(() => {
  const decks = JSON.parse(document.getElementById("decks-data").textContent);
  const get = k => { try { return localStorage.getItem(k); } catch { return null; } };
  for (const [level, kanji] of Object.entries(decks)) {
    const card = document.querySelector(`.deck-card[data-level="${level}"]`);
    if (!card) continue;
    const pct = n => Math.round(n / kanji.length * 100) + "%";
    const position = kanji.indexOf(get("last:" + level)) + 1; // same as the deck page's progress bar
    const learned = kanji.filter(k => get("learned:" + k) === "1").length;
    const prog = card.querySelector(".tag-progress");
    prog.textContent = pct(position);
    prog.setAttribute("aria-label", pct(position) + " progress");
    card.querySelector(".tag-learned").textContent = pct(learned) + " learned";
  }
})();
</script></body></html>
